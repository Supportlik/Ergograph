[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ergograph"
version = "0.1.0"
description = "YAML-driven CV and dossier generator: HTML rendering plus PDF export via Chrome headless"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bortlik", email = "michael@bortlik.io" }]
keywords = ["cv", "resume", "dossier", "pdf", "yaml", "generator"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
pagenumbers = ["pymupdf>=1.24"]

[project.scripts]
ergograph = "ergograph.cli:main"

[project.urls]
Homepage = "https://github.com/Supportlik/ergograph"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ergograph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
