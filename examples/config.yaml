# Example steering file for Ergograph (fictional person)
person:
  name: Alexandra Argyriou

theme: modern
level_max: 6

languages: [de, en]
variants: [mit-stundensatz, ohne-stundensatz]

documents:
  de: [cv, projects, skills, full]
  en: [full]

content:
